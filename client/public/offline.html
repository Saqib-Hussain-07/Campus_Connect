<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c94f2c" />
  <title>Offline | CampusConnect</title>
  <style>
    :root {
      --rust: #c94f2c;
      --rust-light: #e8694a;
      --paper: #f5f0e8;
      --ink: #0d0d0d;
      --card-bg: #161616;
      --text-muted: #a1a1aa;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Bricolage Grotesque', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--ink);
      color: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .offline-card {
      background: var(--card-bg);
      border: 1px solid rgba(201, 79, 44, 0.25);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(201, 79, 44, 0.15);
    }
    .icon-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.25rem auto;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(201, 79, 44, 0.35);
      background: #c94f2c;
    }
    .icon-container img {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      object-fit: cover;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--paper);
    }
    .version-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--rust-light);
      background: rgba(201, 79, 44, 0.15);
      padding: 2px 8px;
      border-radius: 6px;
      margin-bottom: 1rem;
      letter-spacing: 0.04em;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #c94f2c, #e8694a);
      color: white;
      font-weight: 600;
      padding: 0.75rem 1.75rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s ease, transform 0.1s ease;
      text-decoration: none;
    }
    .btn-retry:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .btn-retry:active {
      transform: translateY(0);
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background: rgba(201, 79, 44, 0.2);
      color: #e8694a;
      font-size: 0.8rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-container">
      <img src="/logo192.png" alt="CampusConnect Logo" />
    </div>
    <h1>You're Offline</h1>
    <div class="version-tag">CampusConnect v1.0.0</div>
    <p>It looks like you don't have an active internet connection right now. CampusConnect needs a network connection to fetch live data.</p>
    <button class="btn-retry" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      Try Reconnecting
    </button>
    <div>
      <span class="badge">Offline Mode</span>
    </div>
  </div>

  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
